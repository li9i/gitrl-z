<?xml version="1.0" encoding="UTF-8"?>
<!--
  gitrl-z symbolic icon. Single colour, follows the theme's foreground.

  The silhouette of the application icon: the diamond, with the reflog looping
  anticlockwise around it. The branch glyph inside the diamond is left out
  because at 16 pixels it closes up into a blot.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="currentColor">
    <path d="M5.25 13.89A6.5 6.5 0 1 0 3.40 3.40" fill="none"
          stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M1.84 4.96L2.20 2.20L4.60 4.60Z"/>
    <rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1"
          transform="rotate(45 8 8)"/>
  </g>
</svg>
