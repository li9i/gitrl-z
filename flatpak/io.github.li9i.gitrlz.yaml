# Flatpak manifest for gitrl-z.
#
# Modelled on gitg's Flathub manifest (org.gnome.gitg), since gitrl-z is a
# vendored subtree of gitg 44 with the same toolkit and build system. The
# GNOME runtime already provides GTK 3, libhandy 1, libgee and
# gsettings-desktop-schemas, and the SDK provides Vala, meson and ninja, so
# the libraries built here are libgit2, libgit2-glib and libdazzle, which the
# runtime does not carry.
#
# gitrl-z's closure is smaller than gitg's: it does no network or remote work
# and never runs git, so gitg's gtksourceview, libpeas, gspell, git and
# libssh2 modules are all absent, and libgit2 is built without SSH.
#
# Build and install locally (once flatpak and the GNOME SDK are present):
#
#   flatpak install flathub org.gnome.Platform//50 org.gnome.Sdk//50
#   flatpak-builder --user --install --force-clean \
#     build-dir flatpak/io.github.li9i.gitrlz.yaml
#   flatpak run io.github.li9i.gitrlz
#
# See flatpak/README.md for the full local test and the Flathub submission.
#
app-id: io.github.li9i.gitrlz
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gitrlz

finish-args:
  # A GTK application needs a display and the graphics device; ipc is for
  # the shared-memory X11 path.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # gitrl-z never writes to a repository (it only shows the command a reset
  # would need, for the user to run themselves), so the host is mounted read
  # only. A home-only mount is not enough: repositories live outside home too,
  # and the app must be able to open one wherever it is given.
  - --filesystem=host:ro
  # No --share=network and no secrets or ssh sockets on purpose: gitrl-z is
  # entirely offline and does no authentication.

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: libgit2
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS:BOOL=ON
      - -DBUILD_TESTS:BOOL=OFF
      - -DUSE_THREADS:BOOL=ON
      - -DUSE_SSH:BOOL=OFF
    sources:
      - type: archive
        url: https://github.com/libgit2/libgit2/archive/v1.7.2/libgit2-1.7.2.tar.gz
        sha256: de384e29d7efc9330c6cdb126ebf88342b5025d920dcb7c645defad85195ea7f

  - name: libgit2-glib
    buildsystem: meson
    builddir: true
    config-opts:
      - --buildtype=debugoptimized
      # gitrl-z does no ssh or network work, so libgit2-glib is built without
      # ssh. This also drops its libssh2 build dependency, which is why the
      # libssh2 module gitg carries is absent here. Python bindings are unused.
      - -Dssh=false
      - -Dpython=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgit2-glib/1.2/libgit2-glib-1.2.1.tar.xz
        sha256: 97423a779002b3be8751c75f9d79049dfccca3616a26159fc162486772ba785f

  - name: libdazzle
    buildsystem: meson
    config-opts:
      - -Denable_tests=false
      - -Denable_tools=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libdazzle/3.44/libdazzle-3.44.0.tar.xz
        sha256: 3cd3e45eb6e2680cb05d52e1e80dd8f9d59d4765212f0e28f78e6c1783d18eae

  - name: gitrl-z
    buildsystem: meson
    sources:
      # Flathub build: the release, pinned to the tag and its commit, as the
      # linter requires. Bump both together when cutting the next release.
      - type: git
        url: https://github.com/li9i/gitrl-z.git
        tag: v0.1.0
        # commit: pin to `git rev-list -n 1 v0.1.0` for the Flathub submission
      #
      # Local build from a working checkout: comment out the git source above
      # and uncomment this one instead.
      # - type: dir
      #   path: ..
